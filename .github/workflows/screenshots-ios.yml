name: iOS Screenshots

# Builds the app for the simulator, loads a generated demo library into it,
# and runs Lumisound/UITests/ScreenshotTests.swift, which taps through the
# main screens and saves a PNG of each. The PNGs are uploaded as an artifact
# named "screenshots", and are also pushed to a branch so they can be browsed
# on GitHub: `screenshots` for runs from main, `screenshots-<ref>` for any
# other branch or tag, so runs of different refs don't overwrite each other.
# Each is replaced on every run of its ref.
#
# The demo library is made up (ios/scripts/screenshots/make-demo-library.sh),
# and the app's `-LumisoundScreenshotMode` flag gives it listening history,
# favorites and playlists (see ScreenshotMode.swift). Nothing here signs in,
# so server-backed shelves (friends, stations, Aria) stay empty.

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Simulators, comma-separated (closest available match is used)'
        required: false
        default: 'iPhone 17 Pro Max,iPhone 17'
      tests:
        description: 'Which screens'
        required: false
        default: 'all'
        type: choice
        options: [ all, main, folders, albums ]
      appearance:
        description: 'System appearance'
        required: false
        default: 'dark'
        type: choice
        options: [ dark, light ]

permissions:
  # Pushes the images to the `screenshots` branch.
  contents: write

# Queue rather than cancel: a before/after pair started close together must
# both finish (a cancelled "before" run is how this setting was found).
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      DEVICES: ${{ github.event.inputs.devices || 'iPhone 17 Pro Max,iPhone 17' }}
      APPEARANCE: ${{ github.event.inputs.appearance || 'dark' }}
      TESTS: ${{ github.event.inputs.tests || 'all' }}
      BUNDLE_ID: com.lumisound.ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep '^Xcode' | sort -rV | head -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ffmpeg

      # Same as build-ios.yml, so the screenshots show the configuration that ships.
      - name: Write bridge API key config
        env:
          LUMISOUND_BRIDGE_API_KEY: ${{ secrets.LUMISOUND_BRIDGE_API_KEY }}
        run: |
          mkdir -p ios/Config
          echo "LUMISOUND_BRIDGE_API_KEY = ${LUMISOUND_BRIDGE_API_KEY}" > ios/Config/Secrets.xcconfig

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Generate demo library
        run: ios/scripts/screenshots/make-demo-library.sh "$RUNNER_TEMP/demo-library"

      - name: Build for testing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Lumisound.xcodeproj \
            -scheme LumisoundScreenshots \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*ScreenshotMode|BUILD|TEST BUILD" || true
          if ! grep -q "TEST BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"; then
            grep -E "error:" -A3 "$RUNNER_TEMP/build.log" | head -80
            tail -60 "$RUNNER_TEMP/build.log"
            exit 1
          fi

      - name: Capture screenshots
        working-directory: ios
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name "Lumisound.app" -path "*iphonesimulator*" | head -1)
          [ -n "$APP" ] || { echo "Simulator build of Lumisound.app not found"; exit 1; }
          OUT="$GITHUB_WORKSPACE/screenshots"
          mkdir -p "$OUT"
          status=0

          # Newest iOS runtime's device with this exact name, else any "Pro Max".
          pick_udid() {
            xcrun simctl list devices available -j | jq -r --arg n "$1" '
              [.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name == $n)] | last | .udid // empty'
          }
          fallback_udid() {
            xcrun simctl list devices available -j | jq -r '
              [.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("Pro Max"))] | last | .udid // empty'
          }

          case "$TESTS" in
            main)    ONLY_TESTING="LumisoundUITests/ScreenshotTests/testCaptureScreens" ;;
            folders) ONLY_TESTING="LumisoundUITests/ScreenshotTests/testCaptureFolderScreens" ;;
            albums)  ONLY_TESTING="LumisoundUITests/ScreenshotTests/testCaptureAlbumAndNowPlayingScreens" ;;
            *)       ONLY_TESTING="LumisoundUITests/ScreenshotTests" ;;
          esac

          IFS=',' read -ra NAMES <<<"$DEVICES"
          for raw in "${NAMES[@]}"; do
            NAME="$(echo "$raw" | xargs)"
            UDID="$(pick_udid "$NAME")"
            if [ -z "$UDID" ]; then
              echo "::warning::No simulator named '$NAME'; using the newest Pro Max instead."
              UDID="$(fallback_udid)"
            fi
            [ -n "$UDID" ] || { echo "::error::No usable iOS simulator found"; exit 1; }
            ACTUAL="$(xcrun simctl list devices -j | jq -r --arg u "$UDID" '[.devices[][] | select(.udid == $u)][0].name')"
            SLUG="$(echo "$ACTUAL-$APPEARANCE" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd 'a-z0-9-')"
            echo "::group::$ACTUAL ($APPEARANCE) → $SLUG"

            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            xcrun simctl erase "$UDID"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl ui "$UDID" appearance "$APPEARANCE"
            xcrun simctl status_bar "$UDID" override --time "9:41" \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

            # Install once so the data container exists, then drop the demo
            # library into Documents. `test-without-building` reinstalls over
            # it, which keeps the container's contents.
            xcrun simctl install "$UDID" "$APP"
            DATA="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
            # "Imported Music" is where imports land, and the only place the
            # Folders tab and Home's folder tiles look for subfolders.
            mkdir -p "$DATA/Documents/Imported Music"
            cp -R "$RUNNER_TEMP/demo-library/." "$DATA/Documents/Imported Music/"

            # One retry. On a busy headless runner the simulator's audio
            # service sometimes doesn't answer while the app sets up its
            # AVAudioEngine at launch, and CoreAudio aborts the process
            # (_ReportRPCTimeout). That's the runner, not the app, and the
            # next attempt normally gets through. A retry only happens when
            # the attempt failed AND didn't get as far as Settings.
            for attempt in 1 2; do
              rm -rf "$OUT/$SLUG" "$RUNNER_TEMP/results/$SLUG-$attempt.xcresult"
              attempt_status=0
              TEST_RUNNER_SCREENSHOTS_DIR="$OUT/$SLUG" \
              xcodebuild test-without-building \
                -project Lumisound.xcodeproj \
                -scheme LumisoundScreenshots \
                -configuration Debug \
                -destination "id=$UDID" \
                -derivedDataPath build \
                -resultBundlePath "$RUNNER_TEMP/results/$SLUG-$attempt.xcresult" \
                "-only-testing:$ONLY_TESTING" \
                CODE_SIGNING_ALLOWED=NO 2>&1 \
                | grep -vE '^\s+t = .*(Checking existence|Checking `Expect|Capturing element|Waiting .* to exist)' \
                | tail -250 || attempt_status=1
              if [ "$attempt_status" = 0 ] || [ -f "$OUT/$SLUG/12-settings.png" ] || [ -f "$OUT/$SLUG/21-folder-detail.png" ] || [ "$attempt" = 2 ]; then
                [ "$attempt_status" = 0 ] || status=1
                break
              fi
              echo "::warning::Attempt $attempt on $ACTUAL failed early; retrying once."
              sleep 20
            done

            ls -1 "$OUT/$SLUG" 2>/dev/null || echo "No screenshots written for $SLUG"

            # Simulator app crashes land in the host's DiagnosticReports.
            CRASHES=$(find "$HOME/Library/Logs/DiagnosticReports" -name 'Lumisound*' -newer "$APP" 2>/dev/null || true)
            if [ -n "$CRASHES" ]; then
              echo "::warning::Lumisound crashed during the run; first report follows."
              mkdir -p "$RUNNER_TEMP/results/crashes"
              echo "$CRASHES" | while read -r f; do cp "$f" "$RUNNER_TEMP/results/crashes/"; done
              head -c 12000 "$(echo "$CRASHES" | head -1)"
              echo
            fi
            xcrun simctl shutdown "$UDID" || true
            echo "::endgroup::"
          done
          exit $status

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn

      # A plain branch so the images can be viewed on github.com without
      # downloading the zip. Force-pushed as a single commit each run, so
      # old images don't pile up in its history.
      - name: Publish to the screenshots branch
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TARGET=screenshots
          else
            TARGET="screenshots-$(echo "$GITHUB_REF_NAME" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
          fi
          if [ -z "$(find screenshots -name '*.png' 2>/dev/null | head -1)" ]; then
            echo "No screenshots to publish."
            exit 0
          fi
          PUBLISH="$RUNNER_TEMP/publish"
          rm -rf "$PUBLISH" && mkdir -p "$PUBLISH"
          cp -R screenshots/. "$PUBLISH/"
          {
            echo "# Lumisound screenshots"
            echo
            echo "From [this run]($RUN_URL) on \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA:0:7}\`. Replaced on every run."
            for dir in "$PUBLISH"/*/; do
              name="$(basename "$dir")"
              echo
              echo "## $name"
              echo
              for png in "$dir"*.png; do
                file="$(basename "$png")"
                echo "<img src=\"$name/$file\" width=\"260\" alt=\"${file%.png}\">"
              done
            done
          } > "$PUBLISH/README.md"
          cd "$PUBLISH"
          git init -q -b screenshots
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Screenshots from run ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "screenshots:$TARGET"
          echo "Published: ${{ github.server_url }}/${GITHUB_REPOSITORY}/tree/$TARGET"

      - name: Upload test results and build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-debug
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
