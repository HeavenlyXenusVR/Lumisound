name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options: [ Release, Debug ]

permissions:
  contents: write
  # Needed by the "Cut the release for the new tag" step, which dispatches
  # release-ios.yml — see that step's comment for why a tag push alone cannot
  # trigger it.
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & export IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep '^Xcode' | sort -rV | head -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Mirrors release-ios.yml. Without it Config/Secrets.xcconfig does not
      # exist in a CI checkout (it is gitignored), Base.xcconfig's
      # `#include? "Secrets.xcconfig"` silently no-ops, and this job compiles a
      # binary whose bridge API key is empty — a different configuration from
      # the one that actually ships. A check that builds something other than
      # the artifact cannot vouch for it.
      - name: Write bridge API key config
        env:
          LUMISOUND_BRIDGE_API_KEY: ${{ secrets.LUMISOUND_BRIDGE_API_KEY }}
        run: |
          mkdir -p ios/Config
          echo "LUMISOUND_BRIDGE_API_KEY = ${LUMISOUND_BRIDGE_API_KEY}" > ios/Config/Secrets.xcconfig

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build configuration
        id: config
        run: |
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          echo "configuration=$CONFIG" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Lumisound.xcodeproj \
            -scheme Lumisound \
            -configuration ${{ steps.config.outputs.configuration }} \
            -destination "generic/platform=iOS" \
            -archivePath build/Lumisound.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log | tail -20 || true
          # `pipefail` (the GitHub Actions default) makes this whole pipeline
          # "fail" the instant xcodebuild does, which combined with `-e` used
          # to abort the script right here — before the diagnostic grep below
          # ever ran, so a real compile error never actually got printed. The
          # trailing `|| true` keeps us going so it does; the `[ -z "$APP" ]`
          # check further down still fails the job correctly either way.
          APP=$(find build/Lumisound.xcarchive -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            # Print generously here rather than relying on `grep "error:"` --
            # a whole-module-optimized build batches every file into one
            # frontend invocation, and a genuine failure (crash, diagnostic
            # phrased without the literal substring "error:") can otherwise
            # print nothing at all above `tail -20`'s window, exactly like it
            # did the one time this was actually needed: silently. The `tee`d
            # full log is also uploaded as an artifact below so it survives
            # past this step's truncated console output.
            echo "--- Last 200 lines of xcodebuild output ---"
            tail -200 /tmp/xcodebuild.log
            echo "::error::Archive did not produce a .app bundle"
            exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Upload full xcodebuild log (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          retention-days: 7

      - name: Compile asset catalogs (actool)
        working-directory: ios
        run: |
          APP="$APP_PATH"
          xcrun actool \
            --output-format human-readable-text \
            --notices \
            --warnings \
            --platform iphoneos \
            --minimum-deployment-target 16.0 \
            --target-device iphone \
            --target-device ipad \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/assetcatalog_output.plist \
            --compress-pngs \
            --compile "$APP" \
            "Lumisound/Resources/Assets.xcassets"
          echo "Assets.car: $(du -sh "$APP/Assets.car" 2>/dev/null || echo MISSING)"

      - name: Package IPA (unsigned)
        working-directory: ios
        run: |
          MARKETING_VERSION=$(grep 'MARKETING_VERSION' project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          IPA_NAME="Lumisound-v${MARKETING_VERSION}-unsigned.ipa"
          PAYLOAD_DIR="build/Payload/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd build/Payload
          zip -r "../$IPA_NAME" Payload/ -x "*.DS_Store"
          echo "IPA created: $(du -sh ../$IPA_NAME)"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumisound-unsigned-ipa
          path: ios/build/${{ env.IPA_NAME }}
          retention-days: 14

      - name: Upload archive (for re-signing)
        uses: actions/upload-artifact@v4
        with:
          name: Lumisound-xcarchive
          path: ios/build/Lumisound.xcarchive
          retention-days: 7

      # A successful release build is the single source of truth for tags.
      # Creating the tag only after archive/package steps complete prevents a
      # broken main build from triggering the release workflow.
      #
      # The version is derived from the latest EXISTING tag, not from
      # `MARKETING_VERSION` in ios/project.yml. That field is not bumped per
      # release — it sat at 1.9.0.37 while tags advanced past 1.9.0.57 — so this
      # step computed an already-taken tag every single time, hit the
      # "already exists" branch below, and created nothing. Every release for
      # dozens of versions had to be tagged by hand as a result. The tag is the
      # real version of record (release-ios.yml names the IPA from it), so the
      # tag list is what the next version is counted from.
      - name: Tag successful release build
        id: tag
        if: success() && steps.config.outputs.configuration == 'Release' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Read tags from the remote rather than the checkout: actions/checkout
          # fetches shallow and without tags by default, so a local `git tag -l`
          # here would see nothing and restart versioning from scratch.
          LATEST=$(git ls-remote --tags --refs origin 'refs/tags/ios/v*' \
            | sed 's#.*refs/tags/ios/v##' \
            | sort -V \
            | tail -1)

          if [ -z "$LATEST" ]; then
            echo "No existing ios/v* tag found; refusing to invent a starting version." >&2
            exit 1
          fi

          # Bump the last dotted component. Deliberately arithmetic on that field
          # only: major/minor/patch are product decisions, while this counter is
          # just "the next build", which is exactly how the tag series has been
          # used in practice.
          PREFIX="${LATEST%.*}"
          LAST="${LATEST##*.}"
          case "$LAST" in
            ''|*[!0-9]*)
              echo "Latest tag ios/v$LATEST does not end in a numeric component; not guessing." >&2
              exit 1
              ;;
          esac
          VERSION="${PREFIX}.$((LAST + 1))"
          TAG="ios/v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; leaving it unchanged."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest released tag: ios/v${LATEST} -> new tag: $TAG"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$TAG" -m "Release Lumisound iOS v${VERSION}" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Pushing the tag above is NOT enough to cut a release.
      #
      # GitHub deliberately does not let a push authored by the built-in
      # GITHUB_TOKEN trigger further workflows (loop prevention), so
      # release-ios.yml's `on: push: tags: ios/v*` never fires for a tag created
      # by the step above — the tag just appears with no release behind it. A
      # tag pushed from a developer's own credentials does fire it, which is why
      # hand-tagging has always worked and automation silently did not.
      #
      # workflow_dispatch is the documented exception: dispatching via the API
      # works with GITHUB_TOKEN. So the release is requested explicitly rather
      # than hoped for. This is why `actions: write` is in this workflow's
      # permissions block.
      - name: Cut the release for the new tag
        if: success() && steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Dispatching Release iOS IPA at $TAG"
          gh workflow run "Release iOS IPA" --repo "$GITHUB_REPOSITORY" --ref "$TAG"
