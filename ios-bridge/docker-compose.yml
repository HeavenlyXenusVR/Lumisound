# Standalone compose for ios-bridge, now that it runs back on this host
# (moved off Mel 2026-10-21 -- same CPU-headroom reasoning as Nyxframe/
# SwarmPanel's move, see migration-services.nix's header comment). Was
# previously a service inside Music/docker-compose.yml; that file lives
# with the bots on Mel now, so this is its own compose file. Database
# stays on Mel (the discord_music_gws DB it piggybacks on belongs to the
# gws bot, which stays there) -- DB_HOST below is Mel's LAN IP, same
# pattern SwarmPanel's PANEL_DB_HOST uses.
services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: ios_bgutil_provider
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PORT=4417

  ios-bridge:
    restart: always
    network_mode: "host"
    build: .
    container_name: ios_bridge
    depends_on:
      - bgutil-provider
    environment:
      - YTDLP_CACHE_DIR=/app/.cache/yt-dlp
      - YTDLP_COOKIES_FILE=/app/cookies.txt
      - IOS_BRIDGE_API_KEY=${IOS_BRIDGE_API_KEY:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - GIPHY_API_KEY=${GIPHY_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Was missing entirely from this file (unlike GIPHY/GEMINI above) even
      # though it's set in .env — found while wiring up the artist-images
      # background job's YouTube-channel-icon fallback, which reads this same
      # module-level default. Without it the container always saw an empty
      # YOUTUBE_API_KEY, silently disabling every feature's server-wide
      # fallback (search, channel resolution, subscriptions, this one) for
      # any user who hasn't set a personal key in ios_user_settings.
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      # Aria Transcribe is Gemini-only by design (see lyrics_whisper.py's
      # is_available() gate) — local faster-whisper/ctranslate2 ASR hard-
      # crashes with SIGILL on hardware lacking AVX/SSSE3/SSE4, which is
      # exactly what this container ran on while hosted on Mel. Defaulting
      # unset meant local Whisper ran unconditionally ("1" inside
      # lyrics_whisper.py when this var is absent), silently defeating the
      # Gemini-only intent this whole time — this var was simply never
      # carried into this standalone compose file during the 2026-10-21
      # move off Mel. Override in .env if local ASR is ever wanted again.
      - LUMISOUND_WHISPER_ENABLED=${LUMISOUND_WHISPER_ENABLED:-0}
      - PORT=8002
      - YTDLP_POT_PROVIDER_URL=http://127.0.0.1:4417
      - DB_HOST=192.168.1.87
      - DB_PORT=5432
      - DB_USER=botuser
      - DB_PASSWORD=bot_logins
      - DB_NAME=discord_music_gws
      - IOS_JWT_SECRET=${IOS_JWT_SECRET:-stash-opus-player-jwt-secret-2026}
      - DISCORD_OAUTH_CLIENT_ID=${DISCORD_OAUTH_CLIENT_ID:-}
      - DISCORD_OAUTH_CLIENT_SECRET=${DISCORD_OAUTH_CLIENT_SECRET:-}
      - DISCORD_OAUTH_REDIRECT_URI=https://lumisound-bridge.xenusanimations.studio/api/discord/oauth/callback
      - GITHUB_RELEASES_TOKEN=${GITHUB_RELEASES_TOKEN:-}
      - DISCORD_RPC_DEFAULT_CLIENT_ID=1538651456910004355
      - DISCORD_RPC_DEFAULT_LARGE_IMAGE=lumisound
      - DISCORD_RPC_DEFAULT_SMALL_IMAGE=playpause-small
      - USER_MUSIC_DIR=/usermusic
      - SERVER_MUSIC_DIR=/serverlibrary
      - PENDING_DOWNLOADS_DIR=/app/.cache/pending-downloads
      - YTDLP_MAX_CONCURRENT=4
    volumes:
      - ./cache/yt-dlp:/app/.cache/yt-dlp
      - ./cache/pending-downloads:/app/.cache/pending-downloads
      - ./cookies.txt:/app/cookies.txt:ro
      - /mnt/fastssd/lumisound-user-music:/usermusic
      - /mnt/fastssd/lumisound-server-library:/serverlibrary
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
