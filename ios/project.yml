name: Lumisound

options:
  bundleIdPrefix: com.lumisound
  deploymentTarget:
    # Sideloaded (AltStore/atvloadly unsigned IPAs, not App Store), so the
    # usual "keep this low for broader device reach" reasoning doesn't
    # apply — the only real constraint is the devices actually running
    # this app. Raised from 16.0 (an old default with no deliberate reason
    # behind it) to 26.0 so newer API surface (e.g. AppIntents'
    # Measurement<UnitDuration> parameters) is usable without availability
    # gating or older-OS fallback paths.
    iOS: "26.0"

configs:
  Debug: debug
  Release: release

# Project-wide xcconfig, applied to every target/config — currently just the
# build-time-injected bridge API key (see Config/Base.xcconfig).
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  DSWaveformImage:
    url: https://github.com/dmrschmidt/DSWaveformImage
    from: "14.5.0"
  # Lua VM for the Lua-scripted config/theming/logic layer (Theme/LuaThemeEngine.swift).
  # Lightweight Swift wrapper around Lua 5.1-5.5 (default 5.4); bundles the Lua C
  # source directly (no dynamic library), so it's App-Store-safe and needs no extra
  # embed/signing step — same reason DSWaveformImage above is consumed as plain SPM.
  LuaSwift:
    url: https://github.com/ChrisGVE/LuaSwift
    from: "1.4.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    # This raw build setting is what xcodebuild actually reads — it takes
    # precedence over (and had gone stale relative to) the `options.
    # deploymentTarget.iOS` convenience key above; raising that alone
    # wasn't enough, the Lumisound target kept compiling against iOS 16.0
    # until this was updated too.
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.9.0.31"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: "NO"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      OTHER_SWIFT_FLAGS: "-D DEBUG"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: "YES"

targets:
  Lumisound:
    type: application
    platform: iOS
    # Swift sources
    sources:
      - path: Lumisound/Sources
      # Shared with LumisoundWidget so both targets agree on the Live
      # Activity's data shape without needing a framework target.
      - path: Shared/LiveActivity/LumisoundActivityAttributes.swift
      # Shared with every target below that touches the App Group container.
      - path: Shared/AppGroup.swift
    # Resources listed EXPLICITLY so XcodeGen creates proper build phases:
    #  - .xcassets  → "Compile Asset Catalogs" (actool) — produces Assets.car + icon PNGs
    #  - .strings   → "Copy Bundle Resources"
    # Info.plist and .entitlements are handled via build settings, not here.
    resources:
      - path: Lumisound/Resources/Assets.xcassets
      # Bundled as a folder reference (XcodeGen's default for a plain
      # directory path with no special extension) so the 10 preset scripts
      # stay under a "LuaPresets" subdirectory inside the app bundle —
      # LuaThemeEngine looks them up via
      # `Bundle.main.url(forResource:withExtension:subdirectory: "LuaPresets")`.
      - path: Lumisound/Resources/LuaPresets
      # Same folder-reference treatment for the two newer Lua-scripted
      # feature families (see LuaEffectEngine/LuaVisualizerEngine, which look
      # these up the same way via `LuaUserScriptLibrary.bundledScripts`).
      - path: Lumisound/Resources/LuaEffects
      - path: Lumisound/Resources/LuaVisualizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumisound.ios
        INFOPLIST_FILE: Lumisound/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPS_IN_ASSET_CATALOG_COMPILATION: "YES"
        CODE_SIGN_ENTITLEMENTS: Lumisound/Resources/Lumisound.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: LumisoundWidget
      # NOTE: LumisoundWatch is intentionally NOT embedded here — keeping it out
      # of the released IPA keeps the phone-app sideload bulletproof on tools that
      # can't re-sign embedded watch apps. The target still compiles in CI
      # (build-platforms.yml); flip to `- target: LumisoundWatch / embed: true`
      # once a signing path that supports embedded watch apps is in use.
      - package: DSWaveformImage
        product: DSWaveformImageViews
      - package: LuaSwift
        product: LuaSwift
    scheme:
      buildAction:
        targets:
          - Lumisound
      runAction:
        config: Debug
      testAction:
        config: Debug
      profileAction:
        config: Release
      archiveAction:
        config: Release
      analyzeAction:
        config: Debug
      testTargets:
        - LumisoundTests

  LumisoundWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LumisoundWidget/Sources
      - path: Shared/LiveActivity/LumisoundActivityAttributes.swift
      - path: Shared/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumisound.ios.widget
        INFOPLIST_FILE: LumisoundWidget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LumisoundWidget/LumisoundWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # watchOS companion remote. Intentionally a STANDALONE target (not a dependency
  # of the Lumisound app target / scheme) so a compile error here can never break
  # the iOS release archive. Validated by the separate build-platforms.yml CI.
  LumisoundWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: LumisoundWatch/Sources
      - path: Shared/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumisound.ios.watchkitapp
        INFOPLIST_FILE: LumisoundWatch/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LumisoundWatch/LumisoundWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "NO"
    dependencies:
      - target: LumisoundWatchWidget
    scheme:
      buildAction:
        targets:
          - LumisoundWatch
      archiveAction:
        config: Release

  # Watch complication + Smart Stack widget (now-playing title/artist/play
  # state), embedded in LumisoundWatch. Reads from the watch's OWN local
  # `group.com.lumisound.ios` container — a physically separate app-group
  # instance from the iPhone's, watchOS doesn't share one across devices —
  # written by WatchLocalPlayerManager/WatchWidgetDataService.
  LumisoundWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: LumisoundWatch/WatchWidget/Sources
      - path: Shared/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumisound.ios.watchkitapp.widget
        INFOPLIST_FILE: LumisoundWatch/WatchWidget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LumisoundWatch/WatchWidget/LumisoundWatchWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # tvOS app — standalone (its own scheme), installed via atvloadly from the
  # tvOS .ipa produced by release-tvos.yml. Not tied to the iOS scheme.
  LumisoundTV:
    type: application
    platform: tvOS
    # See the root `deploymentTarget.iOS` comment above — same reasoning.
    deploymentTarget: "26.0"
    sources:
      - path: LumisoundTV/Sources
    resources:
      - path: LumisoundTV/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumisound.ios.tv
        INFOPLIST_FILE: LumisoundTV/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "3"
        SKIP_INSTALL: "NO"
    scheme:
      buildAction:
        targets:
          - LumisoundTV
      archiveAction:
        config: Release

  LumisoundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Lumisound/Tests
    dependencies:
      - target: Lumisound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumisound.ios.tests
        INFOPLIST_FILE: ""
